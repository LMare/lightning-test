<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<title>Lightning Playground - {{ .Title }}</title>
	<link rel="icon" type="image/png" href="/asset/img/logo1.png" />
	<!-- HTMX -->
	<script src="https://unpkg.com/htmx.org@1.9.10"></script>
	<script src="https://unpkg.com/htmx.org/dist/ext/sse.js"></script>
	<!-- TailWindCss avec implémentation DaisyUI-->
	<script src="https://cdn.tailwindcss.com"></script>
	<link href="https://cdn.jsdelivr.net/npm/daisyui@4.5.0/dist/full.min.css" rel="stylesheet" />
	<!-- scripts local -->
	<script src="/asset/js/generic.js"></script>
	<link href="/asset/css/generic.css" rel="stylesheet" />
</head>
<body class="bg-base-200 min-h-screen flex flex-col items-center p-6">

	<header class="flex flex-col items-center w-full">
		<!-- Toaster container -->
		<div class="fixed top-4 right-4 z-50 max-w-sm w-full">
			 <div id="toaster"></div>
		</div>

		<!-- TODO : mettre dans le toaster ? -->
		<div hx-ext="sse" sse-connect="api/stream-event" >
		  <div sse-swap="message"></div>
		  <div sse-swap="error"></div>
		</div>

		<h1 class="text-3xl font-bold mb-6">Lightning Playground</h1>

		<div class="navbar bg-base-100 rounded-box" >
			<div class="navbar-center hidden lg:flex">
				<ul id="menu" class="menu menu-horizontal px-1" hx-target="#result">
					<li>
						<a class="flex items-center gap-2 {{if eq .ActivePage "hello"}}active{{end}}"
							hx-get="/hello"
							hx-push-url="true"
							hx-on="
								htmx:beforeRequest: document.querySelectorAll('#menu a')
									.forEach(el => el.classList.remove('active'));
								htmx:afterRequest: this.classList.add('active')">
								👋 Hello World
						</a>
					</li>
					<li>
						<a class="flex items-center gap-2 {{if eq .ActivePage "person"}}active{{end}}"
							hx-get="/person"
							hx-target="#result"
							hx-push-url="true"
							hx-on="
								htmx:beforeRequest: document.querySelectorAll('#menu a')
									.forEach(el => el.classList.remove('active'));
								htmx:afterRequest: this.classList.add('active')">
								🧑‍🤝‍🧑 Persons
						</a>
					</li>
					<li>
						<a class="flex items-center gap-2 {{if eq .ActivePage "node"}}active{{end}}"
							hx-get="/node"
							hx-target="#result"
							hx-push-url="true"
							hx-on="
								htmx:beforeRequest: document.querySelectorAll('#menu a')
									.forEach(el => el.classList.remove('active'));
								htmx:afterRequest: this.classList.add('active')">
								⚡️ Lightning Node
						</a>
					</li>
				</ul>
			</div>
		</div>
	</header>

	<div id="result" class="overflow-y-auto w-full flex-1">
		{{ .Content }}
	</div>

	<!-- Footer -->
	<footer class="footer items-center p-4 bg-base-300 text-base-content rounded-box mt-4 w-full" style="margin-top:auto;">
		<div class="items-center grid-flow-col">
			<img src="/asset/img/logo1.png" alt="Logo" class="w-8 h-8 mr-2">
			<p>© 2026 Lightning Playground. MIT License. <a href="https://github.com/Lmare/lightning-playground/blob/master/LICENSE" target="_blank" class="underline">See the licence</a>.</p>
		</div>
		<div class="grid-flow-col gap-4 md:place-self-center md:justify-self-end">
			<a href="https://github.com/Lmare/lightning-playground" target="_blank" class="btn btn-ghost">	GitHub</a>
		</div>
		 <div id="version" hx-get="/api/version" hx-trigger="load"></div>
	</footer>

</body>
</html>
