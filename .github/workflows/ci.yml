name: Go CI

on:
  push:
    branches: 
      - "**"
  pull_request:
    branches:
      - "**"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: checkout code
      uses: actions/checkout@v4

    - name: Install Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.25.0'

    - name: check compilation
      run: go build ./...

    - name: check errors formatting
      run: go vet ./...

    - name: run tests
      run: go test -v ./...

    - name: Run all tests with coverage (unit + integration)
      run: |
        # instrumente tous les packages, exécute tous les tests, évite le cache
        go test -coverpkg=./... -coverprofile=cover.out ./... -count=1 -v

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
          file: cover.out
          fail_ci_if_error: true
