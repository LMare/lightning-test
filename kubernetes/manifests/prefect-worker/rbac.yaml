# ServiceAccount pour le worker Prefect
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prefect-worker
  namespace: data

# ClusterRole avec les permissions nécessaires au worker Kubernetes
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prefect-worker
rules:
  # Créer, lister, voir, supprimer les Jobs
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "delete", "patch", "update"]
  
  # Lister et voir les Pods (pour monitorer l'exécution)
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  
  # Lire les logs des Pods
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get", "list"]
  
  # Créer des events (optionnel, pour les notifications)
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]

# ClusterRoleBinding : lie le ClusterRole au ServiceAccount
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prefect-worker
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: prefect-worker
subjects:
  - kind: ServiceAccount
    name: prefect-worker
    namespace: data
